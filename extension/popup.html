<!doctype html>
<html><head><meta charset="utf-8"><title>Improve my prompt</title>
<style>body{font:14px system-ui,sans-serif;width:360px;margin:12px}textarea{width:100%;height:110px;box-sizing:border-box}button{margin:6px 4px 6px 0;padding:6px 10px;border:0;border-radius:6px;background:#4f46e5;color:#fff;cursor:pointer}button.sec{background:#e5e7eb;color:#111}#note{color:#6b7280;font-size:12px}</style>
</head><body>
<h3 style="margin:0 0 8px">✨ Improve my prompt</h3>
<textarea id="in" placeholder="Paste your prompt, or select text on the page first"></textarea>
<div><button id="go">Improve</button><button id="copy" class="sec">Copy</button></div>
<textarea id="out" readonly></textarea>
<p id="note">Uses PromptPilot AI's free Smart mode. If it's busy, you get the built-in improvement.</p>
<script src="popup.js"></script>
</body></html>
